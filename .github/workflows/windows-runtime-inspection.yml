name: Inspect official fixed WebView auxiliary PE images
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pefile==2023.2.7
      - run: python scripts/ci_run.py python scripts/inspect_fixed_webview.py
