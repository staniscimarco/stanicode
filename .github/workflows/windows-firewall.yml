name: Windows offline acceptance firewall preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firewall:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/ci_run.py python scripts/check_windows_firewall.py
