name: Complete Windows payload and actual inference
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: complete-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: ilammy/msvc-dev-cmd@v1
      - run: python scripts/ci_run.py python -m pip install -r requirements-dev.txt -r requirements-build.txt -r requirements-acceptance.txt
      - run: npm ci --no-audit --no-fund
      - run: python scripts/ci_tests.py
      - run: npm run test:ui
      - uses: actions/cache/restore@v4
        id: model_cache
        with:
          path: |
            .local/downloads
            models/*.gguf
          key: windows-cpu-b11669-qwen7b-13fb94bfda8c8cf2
      - name: Acquire and verify actual offline inference payload
        run: python scripts/ci_run.py python scripts/prepare_model.py
      - name: Build standalone backend
        run: python scripts/ci_run.py python scripts/package_agent.py
      - name: Acquire signed Microsoft fixed runtime and its actual notices
        run: python scripts/ci_run.py python scripts/prepare_windows_runtime.py
      - name: Inventory actual dependency license texts
        id: licenses
        continue-on-error: true
        run: python scripts/ci_run.py python scripts/collect_licenses.py
      - name: Real-model coding, actual tests and independent review
        run: python scripts/ci_run.py python scripts/smoke_real_inference.py --agent .local/package/stanicode-agent.exe --bundle .local/package/models
      - name: Compile native Windows desktop
        working-directory: apps/desktop
        run: python ../../scripts/ci_run.py node ../../node_modules/@tauri-apps/cli/tauri.js build --no-bundle
      - name: Actual native offline UI and restart, with developer tools hidden
        run: python scripts/ci_run.py python scripts/smoke_native_windows.py --executable apps/desktop/src-tauri/target/release/stanicode.exe
      - name: Audit actual portable PE imports
        run: python scripts/ci_run.py python scripts/audit_windows_dependencies.py --executable apps/desktop/src-tauri/target/release/stanicode.exe
      - name: Require complete license inventory
        if: steps.licenses.outcome != 'success'
        run: throw 'Dependency licenses remain incomplete; distribution is blocked'
      - name: Assemble verified complete Windows candidate
        run: python scripts/ci_run.py python scripts/build_portable.py --executable apps/desktop/src-tauri/target/release/stanicode.exe
      - uses: actions/upload-artifact@v4
        with:
          name: STANICODE-Windows-x64-complete-candidate
          path: .local/artifacts/*
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-inference-evidence
          path: .local/evidence/
          if-no-files-found: ignore
      - uses: actions/cache/save@v4
        if: always() && steps.model_cache.outputs.cache-hit != 'true'
        with:
          path: |
            .local/downloads
            models/*.gguf
          key: windows-cpu-b11669-qwen7b-13fb94bfda8c8cf2
