name: Complete Windows payload and actual inference
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: ilammy/msvc-dev-cmd@v1
      - run: python -m pip install -r requirements-dev.txt -r requirements-build.txt
      - run: npm ci --no-audit --no-fund
      - run: python scripts/ci_tests.py
      - run: npm run test:ui
      - uses: actions/cache@v4
        with:
          path: |
            .local/downloads
            models/*.gguf
          key: windows-cpu-b11669-qwen7b-13fb94bfda8c8cf2
      - name: Acquire and verify actual offline inference payload
        run: python scripts/ci_run.py python scripts/prepare_model.py
      - name: Build standalone backend
        run: python scripts/ci_run.py python scripts/package_agent.py
      - name: Acquire signed Microsoft fixed runtime and its actual notices
        run: python scripts/ci_run.py python scripts/prepare_windows_runtime.py
      - name: Real-model coding, actual tests and independent review
        run: python scripts/ci_run.py python scripts/smoke_real_inference.py --agent .local/package/stanicode-agent.exe --bundle .local/package/models
      - name: Compile native Windows desktop
        working-directory: apps/desktop
        run: python ../../scripts/ci_run.py node ../../node_modules/@tauri-apps/cli/tauri.js build --no-bundle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-inference-evidence
          path: .local/evidence/
          if-no-files-found: ignore
