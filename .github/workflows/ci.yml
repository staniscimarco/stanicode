name: Validate development build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check services tests scripts
      - run: python -m unittest discover -s tests -v
      - run: npm run test:ui
      - run: npm run build
      - name: Exercise UI in real Chromium with simulated inference
        if: runner.os == 'Linux'
        run: |
          python -m pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium
          python scripts/smoke_browser.py
      - run: npm audit --omit=dev --audit-level=high
      - name: Package backend on Windows
        if: runner.os == 'Windows'
        run: |
          python -m pip install -r requirements-build.txt
          python scripts/package_agent.py
          python scripts/smoke_packaged_agent.py .local/package/stanicode-agent.exe
      - name: Build native Windows development artifact
        if: runner.os == 'Windows'
        run: npm run desktop -- build
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: STANICODE-Windows-development-no-model
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
# No release/tag publication: real-inference and clean Windows acceptance remain required.
